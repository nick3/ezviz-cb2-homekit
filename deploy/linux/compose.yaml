name: ezviz-homekit

services:
  bridge:
    image: "${EZVIZ_HOMEKIT_IMAGE:-ghcr.io/nick3/ezviz-cb2-homekit:latest}"
    pull_policy: "${EZVIZ_PULL_POLICY:-always}"
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      EZVIZ_DATA_DIR: /data
      EZVIZ_LEGACY_DATA_DIR: /legacy-data
      EZVIZ_SETUP_HOST: "${EZVIZ_SETUP_HOST:-0.0.0.0}"
      EZVIZ_SETUP_PORT: "${EZVIZ_SETUP_PORT:-8099}"
      EZVIZ_SERIAL: "${EZVIZ_SERIAL:-}"
      EZVIZ_CAMERA_IP: "${EZVIZ_CAMERA_IP:-}"
      EZVIZ_LISTEN_IP: "${EZVIZ_LISTEN_IP:-}"
      EZVIZ_CALLBACK_PORT: "${EZVIZ_CALLBACK_PORT:-}"
      EZVIZ_ENCODER: "${EZVIZ_ENCODER:-}"
      EZVIZ_POWER_MODE: "${EZVIZ_POWER_MODE:-}"
      EZVIZ_HOMEKIT_TRANSCODE: "${EZVIZ_HOMEKIT_TRANSCODE:-}"
      EZVIZ_WARM_SECONDS: "${EZVIZ_WARM_SECONDS:-}"
      EZVIZ_PIR_PREHEAT: "${EZVIZ_PIR_PREHEAT:-}"
      EZVIZ_PIR_POLL_SECONDS: "${EZVIZ_PIR_POLL_SECONDS:-}"
      EZVIZ_POWER_REFRESH_SECONDS: "${EZVIZ_POWER_REFRESH_SECONDS:-}"
      EZVIZ_REGION: "${EZVIZ_REGION:-}"
      HOMEKIT_NAME: "${HOMEKIT_NAME:-}"
      TZ: "${TZ:-Asia/Shanghai}"
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ezviz-data:/data
      - ./data:/legacy-data:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "/app/deploy/linux/healthcheck.py"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  ezviz-data:
