name: ezviz-homekit

services:
  bridge:
    image: ezviz-homekit:local
    build:
      context: ../..
      dockerfile: deploy/linux/Dockerfile
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 15s
    env_file:
      - .env
    environment:
      EZVIZ_DATA_DIR: /data
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "/app/deploy/linux/healthcheck.py"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
